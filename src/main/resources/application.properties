spring.application.name=nexus

spring.datasource.url=jdbc:postgresql://localhost:5432/nexus
spring.datasource.username=postgres
spring.datasource.password=123

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

## Verificar a necessidade dessa configuração, caso não seja necessario, só excluir este comentario
## no outro projeto essa configuração causou alguns erros pois não mostrava resultados de erros no console,
## fazendo com que o GlobalExceptionHandler necessite do @Order para dizer que o tratamento de erros precisa passar
## passar por ele primeiro, caso nao encontre o tratamento para o erro que a aplicação deu, aí essa configuração abaixo
## do comentario vai ser usada pela aplicação
spring.mvc.problemdetails.enabled=true